name: Sync Japan holiday calendar

on:
  workflow_dispatch:
  schedule:
    # Tuesday 03:17 JST. Weekly checks pick up the Cabinet Office's annual update.
    - cron: '17 18 * * 1'

permissions:
  contents: write

concurrency:
  group: sync-japan-holidays
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate the Cabinet Office calendar
        run: python3 scripts/sync-japan-holidays.py

      - name: Test official dates and future fallback rules
        run: node scripts/test-japan-holidays.mjs

      - name: Commit a changed official calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/data/japan-holidays-official.json; then
            echo "Cabinet Office holiday data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/japan-holidays-official.json
          git commit -m "Update official Japan holiday calendar"
          git push
